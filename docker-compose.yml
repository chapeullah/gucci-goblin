services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gucci
      POSTGRES_USER: gucci
      POSTGRES_PASSWORD: gucci
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8097:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gucci
      SPRING_DATASOURCE_USERNAME: gucci
      SPRING_DATASOURCE_PASSWORD: gucci
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Moscow"
      LOG_DIR: /logs

      COC_API_TOKEN: ${COC_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CLAN_TAG: ${CLAN_TAG}
    tty: true
    stdin_open: true
    volumes:
      - applogs:/logs

volumes:
  pgdata:
  applogs: