name: CI/CD to VPS
run-name: Deploy ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - v2

  workflow_dispatch:
    inputs:
      reset_database:
        description: "Удалить PostgreSQL и логи перед деплоем"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gucci-goblin-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run all tests
        run: mvn -B verify

      - name: Install transfer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Create deployment directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            "root@$SSH_HOST" \
            "mkdir -p /opt/gucci-goblin"

      - name: Upload project
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --include='/src/***' \
            --include='/pom.xml' \
            --include='/Dockerfile' \
            --include='/docker-compose.yml' \
            --exclude='*' \
            ./ "root@$SSH_HOST:/opt/gucci-goblin/"

      - name: Build and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          RESET_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_database || false }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            "root@$SSH_HOST" \
            "RESET_DATABASE='$RESET_DATABASE' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          cd /opt/gucci-goblin

          docker compose config --quiet
          docker compose pull db
          docker compose build --pull --no-cache app

          if [ "${RESET_DATABASE:-false}" = "true" ]; then
            echo "Resetting PostgreSQL and application-log volumes"
            docker compose down -v --remove-orphans
          fi

          if ! docker compose up \
            -d \
            --force-recreate \
            --remove-orphans \
            --wait \
            --wait-timeout 120; then

            docker compose ps -a
            docker compose logs --tail=200
            exit 1
          fi

          docker compose ps
          REMOTE_SCRIPT