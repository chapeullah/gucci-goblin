services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gucci
      POSTGRES_USER: gucci
      POSTGRES_PASSWORD: gucci
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gucci -d gucci"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gucci
      SPRING_DATASOURCE_USERNAME: gucci
      SPRING_DATASOURCE_PASSWORD: gucci
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  pgdata:
